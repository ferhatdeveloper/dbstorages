# Production stack for Dokploy / VPS
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Reverse-proxy: expose only `web` (80). Set FRONTEND_ORIGIN to your public URL.
# PORT / HOST: api listens on HOST=0.0.0.0 and NODE_PORT (default 4000).

services:
  postgres:
    image: postgres:16-alpine
    container_name: graphcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphcore}
      POSTGRES_DB: ${POSTGRES_DB:-graphcore_meta}
    volumes:
      - graphcore_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphcore} -d ${POSTGRES_DB:-graphcore_meta}"]
      interval: 5s
      timeout: 5s
      retries: 15
    expose:
      - "5432"

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: graphcore-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-graphcore}:${POSTGRES_PASSWORD:-graphcore}@postgres:5432/graphcore_demo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-graphcore}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${POSTGREST_PUBLIC_URL:-http://localhost:3001}
    expose:
      - "3000"

  # MinIO: first go-live skips object storage (Docker Hub/Quay pulls denied on VPS).
  # Re-add when registry access is fixed (Dokploy Registry login or mirror).

  api:
    build:
      context: ./backend/node
      dockerfile: Dockerfile
    container_name: graphcore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      NODE_PORT: ${NODE_PORT:-4000}
      PORT: ${NODE_PORT:-4000}
      REQUIRE_META_DB: "1"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost,http://localhost:5173,http://localhost:5174}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER:-graphcore}:${POSTGRES_PASSWORD:-graphcore}@postgres:5432/${POSTGRES_DB:-graphcore_meta}
      TENANT_DATABASE_URL: postgresql://${POSTGRES_USER:-graphcore}:${POSTGRES_PASSWORD:-graphcore}@postgres:5432/graphcore_demo
      PROVISION_ADMIN_URL: postgresql://${POSTGRES_USER:-graphcore}:${POSTGRES_PASSWORD:-graphcore}@postgres:5432/${POSTGRES_DB:-graphcore_meta}
      PROVISION_DB_HOST: ${PROVISION_DB_HOST:-postgres}
      PROVISION_PUBLIC_HOST: ${PROVISION_PUBLIC_HOST:-localhost}
      PROVISION_PUBLIC_PORT: ${PROVISION_PUBLIC_PORT:-5432}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_PRO_YEAR: ${STRIPE_PRICE_PRO_YEAR:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      STRIPE_PRICE_SCALE_YEAR: ${STRIPE_PRICE_SCALE_YEAR:-}
      STRIPE_PRICE_MAX: ${STRIPE_PRICE_MAX:-}
      STRIPE_PRICE_MAX_YEAR: ${STRIPE_PRICE_MAX_YEAR:-}
      STRIPE_PRICE_BACKUP: ${STRIPE_PRICE_BACKUP:-}
      STRIPE_PRICE_BACKUP_YEAR: ${STRIPE_PRICE_BACKUP_YEAR:-}
      STRIPE_PRICE_VPS: ${STRIPE_PRICE_VPS:-}
      STRIPE_PRICE_VPS_YEAR: ${STRIPE_PRICE_VPS_YEAR:-}
      STRIPE_PRICE_VPN: ${STRIPE_PRICE_VPN:-}
      STRIPE_PRICE_VPN_YEAR: ${STRIPE_PRICE_VPN_YEAR:-}
      SUPERVISOR_EMAIL: ${SUPERVISOR_EMAIL:-demo@graphcore.com}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      PAYTR_TEST_MODE: ${PAYTR_TEST_MODE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGREST_URL: http://postgrest:3000
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "1"
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-26214400}
    expose:
      - "${NODE_PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${NODE_PORT:-4000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_NODE_API_BASE: /api
        VITE_GO_API_BASE: /api/v1
        VITE_BASE: /app/
        # Same-origin path split: / = marketing, /app = console
        VITE_WEB_URL: ${VITE_WEB_URL:-}
        VITE_CONSOLE_URL: ${VITE_CONSOLE_URL:-}
    container_name: graphcore-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Dokploy Traefik routes via docker network; avoid host :80 / publish conflicts
    expose:
      - "80"

volumes:
  graphcore_pg_data:
